<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>StretchText Page — Options</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #222; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #bbb; border-radius: 6px; }
    button { margin-top: 14px; padding: 8px 16px; border: 0; border-radius: 6px; background: #ffd41f; color: #111; font-weight: 600; cursor: pointer; }
    button:hover { background: #ffdc4d; }
    .hint { color: #666; font-size: 13px; }
    #status { margin-top: 10px; min-height: 18px; font-size: 13px; }
    code { background: #f2f2f2; padding: 0 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>StretchText Page</h1>
  <p class="hint">Bring your own Pollen: paste a Pollinations API key from
    <a href="https://enter.pollinations.ai/keys" target="_blank" rel="noreferrer">enter.pollinations.ai/keys</a>.
    Every stretch text generation is billed to <em>your</em> key, at the model's listed rate.</p>

  <label for="sttpKey">Pollinations API key (sk_...)</label>
  <input id="sttpKey" type="password" autocomplete="off" placeholder="sk_..." />

  <label for="sttpModel">Text model</label>
  <input id="sttpModel" type="text" placeholder="openai/gpt-5.4-nano" />

  <button id="save">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
